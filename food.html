<!DOCTYPE html>
<html>
<head>
  <title>Name Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      padding: 40px;
    }

    .box {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      box-sizing: border-box;
    }

    button {
      background: #222;
      color: white;
      border: 0;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Name Form</h2>

  <form id="form">

    <input
      type="text"
      id="name"
      placeholder="Enter your name"
      required
    >

    <button type="submit">Submit</button>

  </form>

  <p id="result"></p>

</div>

<script>

const scriptURL = "YOUR_APPS_SCRIPT_WEB_APP_URL";

document.getElementById("form").addEventListener("submit", function(e) {

  e.preventDefault();

  const name = document.getElementById("name").value;

  fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify({
      name: name
    })
  })
  .then(response => response.text())
  .then(data => {

    document.getElementById("result").innerText =
      "Name submitted successfully!";

    document.getElementById("name").value = "";

  })
  .catch(error => {

    document.getElementById("result").innerText =
      "Error submitting name.";

    console.error(error);

  });

});

</script>

</body>
</html>
